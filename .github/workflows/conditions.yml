name: Conditions_check

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  deploy-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: condition on main
        run: echo "Deploying the changes to Production"

  validate-feature:
    if: ${{ startsWith(github.ref, 'refs/heads/feature/') }}
    runs-on: ubuntu-latest
    steps:
      - name: condition check on feature
        run: echo "Running feature validation"
