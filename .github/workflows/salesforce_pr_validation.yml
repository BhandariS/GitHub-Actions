name: Salesforce PR Validation

on:
  pull_request:
    branches: [main]
jobs:
  validate-deployment:
    if: ${{ startsWith(github.head_ref, 'feature/*' )}}
    runs-on: ubuntu-latest

    env:
      ORG: SIT

    steps:
      #1. Code Checkout
      - name: Code Checkout
        uses: actions/checkout@v4

      #2. Install CLI
      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      #3. Create JWT Key File
      - name: Create JWT Jey File
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      #4. Authenticate Credentials using JWT
      - name: Authenticate to Salesforce
        run: |
          sf org login jwt \
           --client-id ${{ secrets.SF_CLIENT_ID }} \
           --jwt-key-file server.key \
           --username ${{ secrets.SF_USERNAME }} \
           --instance-url https://test.salesforce.com

      #5. Verify Org Connection
      - name: Verify Org
        run: sf org display

      #6. Validate Deployment
      - name: Validate deployment
        run: |
          echo "Triggered from Branch: ${{ github.head_ref }}"
          echo "Target Org: $(ORG)"
          sf project deploy validate \
            --source-dir force-app \
            --check-only \
            --test-level RunLocalTests
